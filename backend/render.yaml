services:
  - type: web
    name: integrated-patient-system-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: RAG_ENABLED
        value: "false"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: integrated_patient_system
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: LLM_BACKEND
        value: gemini
      - key: CORS_ORIGINS
        sync: false
