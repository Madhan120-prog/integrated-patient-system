services:
  - type: web
    name: integrated-patient-system-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: integrated_patient_system
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: LLM_BACKEND
        value: gemini
      - key: CORS_ORIGINS
        sync: false
